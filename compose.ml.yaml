services:
  speaker-embedder:
    build: ./speaker-embedder
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      SPEAKER_EMBEDDER_MODEL: speechbrain/spkrec-ecapa-voxceleb
      SPEAKER_EMBEDDER_API_KEY: ${SPEAKER_EMBEDDER_API_KEY:-}
    volumes:
      - speaker-model-cache:/var/cache/speaker-embedder
    deploy:
      resources:
        limits:
          memory: 3G

  face-embedder:
    build: ./face-embedder
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      FACE_EMBEDDER_DETECTOR_PATH: /models/face_detection_yunet_2023mar.onnx
      FACE_EMBEDDER_DETECTOR_SHA256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
      FACE_EMBEDDER_MODEL_PATH: /models/face_recognition_sface_2021dec.onnx
      FACE_EMBEDDER_MODEL: opencv/sface-2021dec@sha256:0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79
      FACE_EMBEDDER_MODEL_SHA256: 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79
      FACE_EMBEDDER_API_KEY: ${FACE_EMBEDDER_API_KEY:-}
      FACE_EMBEDDER_BLUR_THRESHOLD: ${FACE_EMBEDDER_BLUR_THRESHOLD:-35}
    volumes:
      - ./face-embedder/models:/models:ro
    deploy:
      resources:
        limits:
          memory: 1G

  active-speaker:
    build:
      context: ./active-speaker
      args:
        ACTIVE_SPEAKER_DEVICE: ${ACTIVE_SPEAKER_DEVICE:-cpu}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      ACTIVE_SPEAKER_MODEL: talknet/talkset-v1
      ACTIVE_SPEAKER_API_KEY: ${ACTIVE_SPEAKER_API_KEY:-}
      ACTIVE_SPEAKER_IN_MEMORY_FRAMES: ${ACTIVE_SPEAKER_IN_MEMORY_FRAMES:-0}
    deploy:
      resources:
        limits:
          memory: 6G

  person-analyzer:
    build: ./person-analyzer
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      PERSON_ANALYZER_DETECTOR_PATH: /models/face_detection_yunet_2023mar.onnx
      PERSON_ANALYZER_DETECTOR_SHA256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
      PERSON_ANALYZER_DETECTOR: opencv/yunet-2023mar
      PERSON_ANALYZER_EMBEDDING_PATH: /models/face_recognition_sface_2021dec.onnx
      PERSON_ANALYZER_EMBEDDING_SHA256: 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79
      PERSON_ANALYZER_EMBEDDING_MODEL: opencv/sface-2021dec
      PERSON_ANALYZER_API_KEY: ${PERSON_ANALYZER_API_KEY:-}
      PERSON_ANALYZER_FPS: ${PERSON_ANALYZER_FPS:-8}
    volumes:
      - ./face-embedder/models:/models:ro
    tmpfs:
      - /tmp/person-analyzer:size=2g,mode=1700,uid=10001,gid=10001
    deploy:
      resources:
        limits:
          memory: 3G

  audio-analyzer:
    # pyannote.audio 4 pins torchcodec 0.7, which has no Linux ARM64 wheel.
    # Docker Desktop emulates this locally on Apple Silicon; Linux AMD64 runs it natively.
    platform: linux/amd64
    build: ./audio-analyzer
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      AUDIO_ANALYZER_DIARIZATION_PATH: /models/pyannote-community-1
      AUDIO_ANALYZER_DIARIZATION_MODEL: pyannote/speaker-diarization-community-1
      AUDIO_ANALYZER_SEPARATION_PATH: /models/sepformer-whamr16k
      AUDIO_ANALYZER_SEPARATION_MODEL: speechbrain/sepformer-whamr16k@cfd5df650d52eb60ba93e009acdb9894c5900038
      AUDIO_ANALYZER_MANIFEST: /models/SHA256SUMS
      AUDIO_ANALYZER_API_KEY: ${AUDIO_ANALYZER_API_KEY:-}
      AUDIO_ANALYZER_DEVICE: cpu
      TMPDIR: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
    volumes:
      - ./audio-analyzer/models:/models:ro
    tmpfs:
      - /tmp:size=4g,mode=1777
    deploy:
      resources:
        limits:
          memory: 10G

volumes:
  speaker-model-cache:
