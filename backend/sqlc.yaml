version: "2"
sql:
  - engine: "postgresql"
    queries: "db/quries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
