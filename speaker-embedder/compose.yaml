services:
  speaker-embedder:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      SPEAKER_EMBEDDER_MODEL: speechbrain/spkrec-ecapa-voxceleb
      SPEAKER_EMBEDDER_API_KEY: ${SPEAKER_EMBEDDER_API_KEY:-}
    volumes:
      - speaker-model-cache:/var/cache/speaker-embedder
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  speaker-model-cache:
